name: macOS package

# Run list title: nightly · <branch> · <push timestamp>.
run-name: nightly · ${{ github.ref_name }} · ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

on:
  push:
    branches:
      - dev
      - feature/qml-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: arm64
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
      MIACODE_PACKAGE_CHANNEL: nightly
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      - name: Restore finished package
        id: package-cache
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: package-macos-arm64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'resources/**', 'assets/**', 'translations/**', 'templates/**', 'third_party/**', 'scripts/build/**', 'scripts/ffmpeg/**', 'LICENSE', 'LICENSE_SCOPE.md', 'THIRD_PARTY_NOTICES.md') }}

      - name: Set up Python
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore Qt
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .qt/6.11.1
          key: qt-6.11.1-macos-arm64

      - name: Restore media kit
        if: steps.package-cache.outputs.cache-hit != 'true'
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/ffmpeg/macos
          key: media-macos-arm64-${{ hashFiles('scripts/ffmpeg/ensure-macos-ffmpeg.sh', 'scripts/ffmpeg/ensure-macos-ffmpeg-dev.sh') }}
          restore-keys: media-macos-arm64-

      - name: Restore compiled objects
        if: steps.package-cache.outputs.cache-hit != 'true'
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: build-macos
          key: build-macos-arm64-qt6.11.1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'resources/**', 'translations/**', 'third_party/**', 'scripts/build/build-macos-ci.sh') }}
          restore-keys: build-macos-arm64-qt6.11.1-

      - name: Set up compiler cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build and package
        if: steps.package-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: bash scripts/build/build-macos-ci.sh

      - name: Save media kit
        if: always() && steps.package-cache.outputs.cache-hit != 'true' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party/ffmpeg/macos
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Save compiled objects
        if: always() && steps.package-cache.outputs.cache-hit != 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build-macos
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Resolve artifact name
        id: package
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.7z)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "Expected one macOS package archive under dist/, found: ${packages[*]}" >&2
            exit 1
          fi
          printf 'archive_name=%s\n' "$(basename "${packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: Save finished package
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 14
